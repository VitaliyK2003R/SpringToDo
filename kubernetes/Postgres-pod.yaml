apiVersion: v1
kind: Pod
metadata:
  name: postgres-pod
  labels:
    name: postgres-pod
    type: backend
spec:
  containers:
    - name: postgres
      image: postgres:12-alpine
      ports:
        - containerPort: 5432
      env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: qwerty
        - name: POSTGRES_DB
          value: to_do_base