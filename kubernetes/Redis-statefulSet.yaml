apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      name: redis-pod
      type: backend
  template:
    metadata:
      labels:
        name: redis-pod
        type: backend
    spec:
      containers:
        - name: redis
          image: redis:6.2-alpine
          command: [ "redis-server", "/usr/local/etc/redis/redis.conf" ]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: standard
        resources:
          requests:
            storage: 200Mi
